name: Sequoia-X 选股 + DSA 分析

# 放在 daily_stock_analysis fork 的 .github/workflows/sequoia-dsa.yml
# Sequoia-X 源码来自本仓库的 sequoia-enhanced 分支（个人增强版：8 策略 + 基本面 + 共振）
# 需要先禁用官方 00-daily-analysis.yml 的 schedule，否则会重复分析两遍。

on:
  schedule:
    # 北京时间 19:30 = UTC 11:30，周一到周五
    - cron: '30 11 * * 1-5'
  workflow_dispatch:
    inputs:
      max_picks:
        description: '最多交给 DSA 分析的股票数量'
        required: false
        default: '10'
      force_run:
        description: '跳过 DSA 的交易日检查（A股节假日调试用）'
        required: false
        type: boolean
        default: false
      force_screen:
        description: '强制跑选股（跳过 Sequoia-X 交易日判断，假日回填数据用）'
        required: false
        type: boolean
        default: false
      backfill_only:
        description: '只回填历史行情，不跑 DSA 分析'
        required: false
        type: boolean
        default: false

concurrency:
  group: sequoia-dsa
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    # 首次要在美国机房回填 5200 只 A 股历史（可能 3~4 小时），给它足够时间
    timeout-minutes: 355

    steps:
      - name: 检出 daily_stock_analysis
        uses: actions/checkout@v5
        with:
          path: dsa

      - name: 检出 Sequoia-X 增强版
        uses: actions/checkout@v5
        with:
          repository: ${{ github.repository }}
          ref: sequoia-enhanced
          path: dsa/_sequoia

      - name: 恢复 Sequoia-X 行情数据库
        uses: actions/cache/restore@v4
        with:
          path: dsa/_sequoia/data
          key: sequoia-enhanced-db-${{ github.run_id }}
          restore-keys: |
            sequoia-enhanced-db-

      - name: 播种行情数据库（首次，来自 Release 资源）
        working-directory: dsa
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SEED_TAG: ${{ vars.SEQUOIA_DB_SEED_TAG || 'db-seed' }}
        run: |
          DB="${{ github.workspace }}/dsa/_sequoia/data/sequoia_v2.db"
          mkdir -p "$(dirname "$DB")"
          if [ -f "$DB" ]; then
            COUNT=$(python3 -c "import sqlite3;print(sqlite3.connect('$DB').execute('select count(distinct symbol) from stock_daily').fetchone()[0])" 2>/dev/null || echo 0)
            echo "已有数据库，股票数=$COUNT"
            if [ "$COUNT" -ge 4000 ]; then echo "数据完整，跳过播种"; exit 0; fi
          fi
          echo "尝试从 Release($SEED_TAG) 下载种子数据库..."
          if gh release download "$SEED_TAG" --repo "${{ github.repository }}" --pattern sequoia_v2.db --output "$DB" --clobber; then
            echo "种子数据库已就位，之后走增量更新"
          else
            echo "没有找到种子资源，将走正常回填（约 3~4 小时）"
          fi


      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            dsa/requirements.txt
            dsa/_sequoia/pyproject.toml

      - name: 安装依赖
        working-directory: dsa
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install "pydantic-settings>=2.0" "rich>=13.0" "python-dotenv>=1.0" "baostock>=0.9" "pandas>=2.0" "requests>=2.31" "akshare>=1.10"

      - name: 准备目录
        working-directory: dsa
        run: mkdir -p data logs reports

      - name: Sequoia-X 选股
        id: screen
        working-directory: dsa
        env:
          SEQUOIA_DIR: ${{ github.workspace }}/dsa/_sequoia
          DB_PATH: ${{ github.workspace }}/dsa/_sequoia/data/sequoia_v2.db
          PICKS_FILE: ${{ github.workspace }}/dsa/sequoia_picks.txt
          START_DATE: ${{ vars.SEQUOIA_START_DATE || '2024-01-01' }}
          # Sequoia-X 的 Settings 必填字段；这里只用于通过校验，不实际推送
          FEISHU_WEBHOOK_URL: ${{ secrets.SEQUOIA_FEISHU_WEBHOOK_URL || 'https://example.invalid/unused' }}
          SEQUOIA_MAX_PICKS: ${{ github.event.inputs.max_picks || vars.SEQUOIA_MAX_PICKS || '10' }}
          SEQUOIA_FORCE: ${{ github.event.inputs.force_screen }}
        run: |
          EXTRA=""
          if [ "$SEQUOIA_FORCE" = "true" ]; then EXTRA="--force"; fi
          python scripts/sequoia_bridge.py --max-picks "$SEQUOIA_MAX_PICKS" $EXTRA

      - name: 保存 Sequoia-X 行情数据库
        if: always()
        uses: actions/cache/save@v4
        with:
          path: dsa/_sequoia/data
          key: sequoia-enhanced-db-${{ github.run_id }}

      - name: 显示候选股
        if: always()
        working-directory: dsa
        run: |
          echo "候选股: ${{ steps.screen.outputs.picks }}"
          echo "数量: ${{ steps.screen.outputs.count }}"

      # DSA 分析。这里只列了常用配置，若你用别的模型/推送渠道，
      # 把官方 00-daily-analysis.yml 里对应的 env 行复制过来即可。
      - name: DSA 深度分析
        if: steps.screen.outputs.count != '0' && steps.screen.outputs.count != '' && github.event.inputs.backfill_only != 'true'
        working-directory: dsa
        env:
          STOCK_LIST: ${{ steps.screen.outputs.picks }}
          FORCE_RUN: ${{ github.event.inputs.force_run }}
          GENERATION_BACKEND: ${{ vars.GENERATION_BACKEND || secrets.GENERATION_BACKEND }}
          GENERATION_FALLBACK_BACKEND: ${{ vars.GENERATION_FALLBACK_BACKEND || secrets.GENERATION_FALLBACK_BACKEND }}
          LITELLM_API_KEY: ${{ secrets.LITELLM_API_KEY }}
          LITELLM_MODEL: ${{ vars.LITELLM_MODEL || secrets.LITELLM_MODEL }}
          LITELLM_FALLBACK_MODELS: ${{ vars.LITELLM_FALLBACK_MODELS || secrets.LITELLM_FALLBACK_MODELS }}
          LITELLM_CONFIG_YAML: ${{ vars.LITELLM_CONFIG_YAML || secrets.LITELLM_CONFIG_YAML }}
          LLM_TEMPERATURE: ${{ vars.LLM_TEMPERATURE || secrets.LLM_TEMPERATURE }}
          TUSHARE_TOKEN: ${{ secrets.TUSHARE_TOKEN }}
          TAVILY_API_KEYS: ${{ secrets.TAVILY_API_KEYS }}
          SERPAPI_API_KEYS: ${{ secrets.SERPAPI_API_KEYS }}
          BOCHA_API_KEYS: ${{ secrets.BOCHA_API_KEYS }}
          WECHAT_WEBHOOK_URL: ${{ secrets.WECHAT_WEBHOOK_URL }}
          FEISHU_WEBHOOK_URL: ${{ secrets.DSA_FEISHU_WEBHOOK_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
        run: |
          EXTRA=""
          if [ "$FORCE_RUN" = "true" ]; then EXTRA="--force-run"; fi
          python main.py --stocks "${{ steps.screen.outputs.picks }}" $EXTRA

      - name: 今日无候选股
        if: steps.screen.outputs.count == '0' && github.event.inputs.backfill_only != 'true'
        run: echo "今日没有股票触发 Sequoia-X 策略，跳过 DSA 分析。"

      - name: 仅回填模式完成
        if: github.event.inputs.backfill_only == 'true'
        run: echo "仅回填模式：行情数据库已更新并缓存，跳过 DSA 分析。"

      - name: 上传选股结果与报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sequoia-dsa-${{ github.run_number }}
          path: |
            dsa/sequoia_picks.txt
            dsa/reports/
            dsa/logs/
          if-no-files-found: ignore
          retention-days: 30
